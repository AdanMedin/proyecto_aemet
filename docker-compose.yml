services:
  postgres:
    image: postgres:16
    container_name: aemet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aemet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aemet}
      POSTGRES_DB: ${POSTGRES_DB:-aemet}
    ports:
      - "5432:5432"
    volumes:
      - aemet_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: aemet_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@aemet.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  aemet_pgdata:
