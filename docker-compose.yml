services:
  postgres:
    image: postgres:16
    container_name: aemet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aemet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aemet}
      POSTGRES_DB: ${POSTGRES_DB:-aemet}
    ports:
      - "5432:5432"
    volumes:
      - aemet_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # La API esperara a que este "healthy" antes de arrancar.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aemet} -d ${POSTGRES_DB:-aemet}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: aemet_api
    restart: unless-stopped
    environment:
      # Dentro de Docker el host de la BD es "postgres" (el nombre del servicio), no "localhost". Esquema postgresql:// porque la app usa asyncpg.
      DATABASE_DSN: postgresql://${POSTGRES_USER:-aemet}:${POSTGRES_PASSWORD:-aemet}@postgres:5432/${POSTGRES_DB:-aemet}
      RUTA_MODELOS: proyecto_aemet_api/ml/artifacts
    ports:
      - "8000:8000"
    volumes:
      # Modelos entrenados desde el host, sin reconstruir la imagen.
      - ./proyecto_aemet_api/ml/artifacts:/app/proyecto_aemet_api/ml/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    container_name: aemet_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@aemet.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  aemet_pgdata:
